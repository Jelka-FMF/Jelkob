[tool.poetry]
name = "jelkob"
description = "Main website for accessing and managing Jelka FMF"
license = "GPL-3.0-or-later"

homepage = "https://github.com/Jelka-FMF/Jelkob"
repository = "https://github.com/Jelka-FMF/Jelkob"
authors = ["Programerski klub FMF"]

package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

daphne = "^4.2.3"
django = "^6.1.2"
djangorestframework = "^3.18.3"
django-filter = "^26.2"
django-solo = "^2.5.1"
django-polymorphic = "^4.11.7"
django-simple-history = "^3.13.0"
django-templates-macros = "^0.3"
django-cors-headers = "^4.9.0"
django-eventstream = { extras = ["drf"], version = "^5.3.4" }
python-dotenv = "^1.2.4"
httpx = "^0.28.1"

psycopg = { version = "^3.3.6", optional = true, extras = ["binary"] }
mysqlclient = { version = "^2.3.0", optional = true }
oracledb = { version = "^26.0.1", optional = true }

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.2"

[tool.poetry.extras]
postgres = ["psycopg"]
mysql = ["mysqlclient"]
oracle = ["oracledb"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["F", "E", "W", "UP", "DJ", "B", "G", "RUF"]
ignore = ["E203", "E501", "RUF012"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
